<!DOCTYPE html>

<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport"/><meta content="#fffdf8" name="theme-color"/><title>MoveGo | Notifications</title><link href="../css/notifications.css?v=1" rel="stylesheet"/><script defer="" src="../js/notifications.js?v=1"></script><link href="../css/modern-icons.css?v=1" rel="stylesheet"/><script defer="" src="../js/modern-icons.js?v=1"></script><link rel="stylesheet" href="../css/movego-back.css?v=option4-1">
<script src="../js/movego-back.js?v=option4-1" defer></script>
<link rel="manifest" href="/app/passenger/manifest.json">
<meta name="theme-color" content="#16824a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
</head>
<body><main class="app"><header class="top"><a aria-label="Back to home" class="back" href="home.html"><svg aria-hidden="true" class="movego-back-icon" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M19 12H5"></path><path d="m12 19-7-7 7-7"></path></svg></a><div class="heading"><strong>Notifications</strong><small>Your updates in one place</small></div><span class="tag">DEMO</span></header>
<section class="summary"><div><p class="eyebrow">ACTIVITY CENTRE</p><h1>Stay in the loop</h1><p>Trip, payment and account notifications will appear here when connected to Django.</p></div><div aria-hidden="true" class="bell">♧</div></section>
<div class="tools"><div aria-label="Filter notifications" class="filters" role="group"><button aria-pressed="true" class="active" data-filter="all" type="button">All</button><button aria-pressed="false" data-filter="ride" type="button">Rides</button><button aria-pressed="false" data-filter="payment" type="button">Payments</button><button aria-pressed="false" data-filter="account" type="button">Account</button></div><button class="text-btn" id="mark-all" type="button">Mark all read</button></div>
<p aria-live="polite" class="counter" id="counter"></p><div aria-live="polite" class="items" id="notifications"></div>
<section class="test-tools"><p>Frontend testing only. Sample notifications are generated locally and are not actual ride or payment events.</p><button id="load-demo" type="button">Load sample notifications</button><button id="clear-demo" type="button">Clear demo notifications</button></section><p aria-live="polite" class="message" id="message" role="status"></p>
</main>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/app/passenger/sw.js")
      .catch(console.error);
  });
}
</script>
</body></html>
