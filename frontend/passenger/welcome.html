<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="description" content="MoveGo — Your city. Your ride.">
<link rel="manifest" href="/app/passenger/manifest.json">
<meta name="theme-color" content="#00C853">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>MoveGo — Welcome</title>
<link rel="stylesheet" href="../css/movego-welcome.css?v=logo4">
<script src="../js/movego-welcome.js?v=2" defer></script>
<script src="../js/movego-cache-register.js?v=3b0fc2dee2ef3968" defer data-movego-image-cache="1"></script>
</head>
<body>
<main class="welcome" aria-labelledby="welcome-tagline">
  <video class="welcome-video" autoplay muted loop playsinline preload="metadata" aria-hidden="true">
    <source src="../videos/wpv.mp4?v=3" type="video/mp4">
  </video>
  <div class="welcome-shade" aria-hidden="true"></div>
  <header class="brand">
    <img class="brand-logo-img" src="../assets/movego-original-logo.png?v=3" alt="MoveGo — Your city. Your ride.">
  </header>
  <nav class="welcome-actions" aria-label="Get started">
    <a class="btn btn-primary" href="./index.html?onboarding=1"><span>Get Started</span><svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></a>
    <a class="btn btn-outline" href="./phone.html">I already have an account</a>
  </nav>
</main>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/app/passenger/sw.js")
      .catch(console.error);
  });
}
</script>

</body>
</html>
