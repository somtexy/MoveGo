<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fffdf8">
  <link rel="manifest" href="/app/passenger/manifest.json">
<meta name="theme-color" content="#16824a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>MoveGo | Introduce yourself</title>
  <link rel="stylesheet" href="../css/profile.css?v=1">
  <script src="../js/profile.js?v=28" defer></script>
<link rel="stylesheet" href="../css/modern-icons.css?v=1"><script src="../js/modern-icons.js?v=1" defer></script><link rel="stylesheet" href="../css/movego-back.css?v=option4-1">
<script src="../js/movego-back.js?v=option4-1" defer></script>
</head>
<body>
  <main class="screen">
    <header class="header">
      <a class="back" href="role.html" aria-label="Back to role selection">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
      </a>
    </header>
    <section class="intro">
      <h1>Welcome to <span>MoveGo!</span></h1>
      <p>Please introduce yourself.</p>
    </section>
    <form id="profile-form" class="profile-form" novalidate>
      <label class="name-field" for="first-name">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></svg>
        <input id="first-name" name="firstName" type="text" placeholder="First name" aria-label="First name" autocomplete="given-name" maxlength="50" required>
      </label>
      <p class="error" id="name-error" role="alert" aria-live="polite"></p>
      <button type="submit" class="next" id="next-btn">Next</button>
      <p class="notice" id="notice" role="status" aria-live="polite"></p>
    </form>
    <div class="illustration" role="img" aria-label="A person holding a phone beside a white car in the city"></div>
  </main>

  <script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/app/passenger/sw.js")
      .catch(console.error);
  });
}
</script>

</body>
</html>
