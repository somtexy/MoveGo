<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#fffdf8"><title>MoveGo | Choose your role</title><link rel="stylesheet" href="../css/role.css?v=1"><script src="../js/role.js?v=28" defer></script><link rel="stylesheet" href="../css/modern-icons.css?v=1"><script src="../js/modern-icons.js?v=1" defer></script><link rel="stylesheet" href="../css/movego-back.css?v=option4-1">

<body><main class="screen"><header class="header"><a class="back" href="passkey.html" aria-label="Back to passkey screen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></a></header>
<section class="intro"><h1>Are you a passenger<br>or a driver?</h1><p>You can change the mode later.</p></section>
<section class="options" aria-label="Select how to use MoveGo">
<button class="role-card" type="button" data-role="passenger" aria-label="Choose Passenger mode"><img src="../assets/images/role-passenger.jpg?v=1" alt="Passenger sitting inside a car"/><span class="role-info"><span class="role-icon" aria-hidden="true">🚙</span><span class="role-copy"><strong>Passenger</strong><small>Book rides, get around<br>the city and more.</small></span><svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></span></button>
<button class="role-card" type="button" data-role="driver" aria-label="Choose Driver mode"><img src="../assets/images/role-driver.jpg?v=1" alt="Driver smiling at the steering wheel"/><span class="role-info"><span class="role-icon" aria-hidden="true">◉</span><span class="role-copy"><strong>Driver</strong><small>Earn by driving and<br>provide rides.</small></span><svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></span></button>
</section><p id="feedback" class="feedback" role="status" aria-live="polite"></p>
</main>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/app/passenger/sw.js")
      .catch(console.error);
  });
}
</script>
